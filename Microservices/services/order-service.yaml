apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app: order-service
    tier: backend
    app.kubernetes.io/part-of: microservices-demo
spec:
  # ClusterIP => internal-only, stable DNS name for service discovery.
  # The gateway reaches this pod set at http://order-service:3002
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      protocol: TCP
      port: 3002         # port other services call
      targetPort: http      # named container port -> 3002
