apiVersion: v1
kind: Service
metadata:
  name: user-service
  labels:
    app: user-service
    tier: backend
    app.kubernetes.io/part-of: microservices-demo
spec:
  # ClusterIP => internal-only, stable DNS name for service discovery.
  # The gateway reaches this pod set at http://user-service:3000
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - name: http
      protocol: TCP
      port: 3000         # port other services call
      targetPort: http      # named container port -> 3000
